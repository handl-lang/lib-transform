[package]
name = "handl-lib-transform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "transform: Handl stdlib port."
license = "MIT"
repository = "https://github.com/handl-lang/lib-transform"
homepage = "https://github.com/handl-lang/lib-transform"
readme = "README.md"

# `transform.*` ops are native `handl_ops::Op` impls; the .hnl files are
# the pure-handl arrow surface.
[dependencies]
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-lib-ops = { path = "../kernel/crates/ops" }